<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <title>Raiku Live Transcript</title>

  <style>
    :root{
      --green:#b7ff3c;
      --green-soft:rgba(183,255,60,.08);

      --bg:#050505;
      --bg2:#0d0d0d;
      --bg3:#151515;

      --border:#232323;

      --text:#f5f5f5;
      --muted:#8b8b8b;
      --dim:#666;

      --shadow:0 10px 30px rgba(0,0,0,.35);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Inter,sans-serif;
      background:
      radial-gradient(circle at top right, rgba(183,255,60,.06), transparent 20%),
      var(--bg);

      color:var(--text);

      height:100vh;
      overflow:hidden;

      display:flex;
      flex-direction:column;
    }

    header{
      height:64px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:0 24px;

      background:rgba(10,10,10,.9);

      border-bottom:1px solid var(--border);

      backdrop-filter:blur(16px);

      flex-shrink:0;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo-box{
      width:38px;
      height:38px;

      border-radius:12px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:linear-gradient(135deg,#111,#1d1d1d);

      border:1px solid rgba(183,255,60,.2);

      color:var(--green);

      font-weight:900;
    }

    .logo h1{
      font-size:1rem;
      letter-spacing:1px;
    }

    .search{
      width:320px;
      max-width:100%;
    }

    .search input{
      width:100%;
      height:42px;

      border:none;
      outline:none;

      border-radius:14px;

      background:rgba(255,255,255,.03);

      border:1px solid var(--border);

      color:var(--text);

      padding:0 14px;

      transition:.2s;
    }

    .search input:focus{
      border-color:rgba(183,255,60,.3);
      box-shadow:0 0 0 4px rgba(183,255,60,.06);
    }

    .layout{
      flex:1;
      display:flex;
      overflow:hidden;
    }

    aside{
      width:300px;
      flex-shrink:0;

      border-right:1px solid var(--border);

      background:rgba(10,10,10,.9);

      overflow:hidden;

      display:flex;
      flex-direction:column;
    }

    .sidebar-title{
      padding:18px;

      border-bottom:1px solid var(--border);

      font-size:.72rem;
      letter-spacing:1.4px;

      text-transform:uppercase;

      color:var(--muted);
    }

    .session-list{
      overflow-y:auto;
      padding:10px;
      flex:1;
    }

    .session{
      padding:14px;
      border-radius:18px;

      margin-bottom:10px;

      cursor:pointer;

      background:rgba(255,255,255,.02);

      border:1px solid transparent;

      transition:.2s;
    }

    .session:hover{
      transform:translateY(-2px);

      background:rgba(255,255,255,.03);

      border-color:rgba(255,255,255,.05);
    }

    .session.active{
      background:rgba(183,255,60,.08);

      border-color:rgba(183,255,60,.15);
    }

    .session-title{
      font-size:.85rem;
      font-weight:700;

      margin-bottom:6px;
    }

    .session-meta{
      font-size:.72rem;
      color:var(--muted);
    }

    main{
      flex:1;
      overflow:hidden;

      display:flex;
      flex-direction:column;
    }

    .topbar{
      padding:18px 24px;

      border-bottom:1px solid var(--border);

      background:rgba(10,10,10,.75);

      backdrop-filter:blur(14px);
    }

    .topbar h2{
      font-size:1rem;
      margin-bottom:6px;
    }

    .topbar p{
      color:var(--muted);
      font-size:.8rem;
    }

    .messages{
      flex:1;

      overflow-y:auto;

      padding:28px;
    }

    .messages::-webkit-scrollbar{
      width:5px;
    }

    .messages::-webkit-scrollbar-thumb{
      background:#222;
      border-radius:999px;
    }

    .message{
      margin-bottom:18px;
    }

    .message-head{
      display:flex;
      align-items:center;
      gap:8px;

      margin-bottom:8px;
    }

    .speaker{
      font-size:.82rem;
      font-weight:700;

      color:var(--green);
    }

    .time{
      font-size:.7rem;
      color:var(--dim);
    }

    .bubble{
      max-width:900px;

      padding:15px 16px;

      border-radius:18px;

      background:rgba(255,255,255,.03);

      border:1px solid rgba(255,255,255,.05);

      line-height:1.8;

      font-size:.9rem;

      box-shadow:var(--shadow);
    }

    .empty{
      flex:1;

      display:flex;
      align-items:center;
      justify-content:center;

      flex-direction:column;

      gap:16px;

      text-align:center;

      padding:40px;
    }

    .empty-logo{
      width:90px;
      height:90px;

      border-radius:24px;

      background:linear-gradient(135deg,#111,#1d1d1d);

      border:1px solid rgba(183,255,60,.2);

      display:flex;
      align-items:center;
      justify-content:center;

      color:var(--green);

      font-size:2rem;
      font-weight:900;
    }

    .empty p{
      color:var(--muted);
      max-width:420px;
      line-height:1.7;
    }

    footer{
      height:50px;

      border-top:1px solid var(--border);

      display:flex;
      align-items:center;
      justify-content:center;

      color:var(--dim);

      font-size:.75rem;

      flex-shrink:0;
    }

    @media(max-width:900px){

      aside{
        width:240px;
      }

    }

    @media(max-width:700px){

      .layout{
        flex-direction:column;
      }

      aside{
        width:100%;
        height:220px;
      }

      .messages{
        padding:18px;
      }

      header{
        gap:12px;
      }

      .search{
        width:180px;
      }

    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    <div class="logo-box">R</div>
    <h1>RAIKU LIVE</h1>
  </div>

  <div class="search">
    <input
      type="text"
      id="searchInput"
      placeholder="Search transcript..."
    />
  </div>

</header>

<div class="layout">

  <aside>

    <div class="sidebar-title">
      Live Sessions
    </div>

    <div class="session-list" id="sessionList"></div>

  </aside>

  <main id="mainPanel">

    <div class="empty">

      <div class="empty-logo">R</div>

      <h2>Raiku Transcript Archive</h2>

      <p>
        Realtime transcript viewer powered by liveness.cc.
      </p>

    </div>

  </main>

</div>

<footer>
  Realtime transcript viewer · liveness.cc
</footer>

<script>

const API_URL =
"https://corsproxy.io/?https://liveness.cc/transcription/1337420798754947173";

let SESSIONS = [];

let currentSession = null;

async function loadSessions(){

  try{

    const res = await fetch(API_URL);

    const raw = await res.json();

    console.log("RAW API:", raw);

    let data = raw;

    // FIX CORS PROXY WRAPPER
    if(
      raw &&
      typeof raw.contents === "string"
    ){

      try{

        data = JSON.parse(raw.contents);

      }catch{

        console.log(
          "contents is not valid json"
        );

        data = raw;

      }

    }

    console.log("PARSED DATA:", data);

    // FIX STRUCTURE
    if(Array.isArray(data.sessions)){

      SESSIONS = data.sessions;

    }else if(Array.isArray(data)){

      SESSIONS = data;

    }else{

      SESSIONS = [data];

    }

    renderSidebar();

    if(
      !currentSession &&
      SESSIONS.length
    ){

      openSession(
        SESSIONS[0].id ||
        SESSIONS[0]._id ||
        0
      );

    }

  }catch(err){

    console.error(err);

    document.getElementById(
      "mainPanel"
    ).innerHTML = `

      <div class="empty">

        <div class="empty-logo">!</div>

        <h2>Failed to load</h2>

        <p>
          ${err.message}
        </p>

      </div>

    `;

  }

}

function renderSidebar(){

  const el =
    document.getElementById(
      "sessionList"
    );

  el.innerHTML = "";

  SESSIONS.forEach(session => {

    const logs =
      session.logs ||
      session.messages ||
      session.transcripts ||
      [];

    const sessionId =
      session.id ||
      session._id ||
      0;

    const div =
      document.createElement("div");

    div.className =
      "session " +
      (
        currentSession === sessionId
        ? "active"
        : ""
      );

    div.innerHTML = `

      <div class="session-title">

        ${
          session.name ||
          session.title ||
          "Live Session"
        }

      </div>

      <div class="session-meta">

        ${logs.length} messages

      </div>

    `;

    div.onclick = () => {

      openSession(sessionId);

    };

    el.appendChild(div);

  });

}

function openSession(id){

  currentSession = id;

  renderSidebar();

  const session =
    SESSIONS.find(
      s =>
      (
        s.id ||
        s._id ||
        0
      ) === id
    );

  if(!session) return;

  const logs =
    session.logs ||
    session.messages ||
    session.transcripts ||
    [];

  document.getElementById(
    "mainPanel"
  ).innerHTML = `

    <div class="topbar">

      <h2>

        ${
          session.name ||
          session.title ||
          "Live Session"
        }

      </h2>

      <p>

        ${logs.length}
        transcript messages

      </p>

    </div>

    <div
      class="messages"
      id="messages"
    ></div>

  `;

  const messages =
    document.getElementById(
      "messages"
    );

  logs.forEach(log => {

    const div =
      document.createElement("div");

    div.className = "message";

    div.innerHTML = `

      <div class="message-head">

        <div class="speaker">

          ${
            escapeHtml(
              log.speaker ||
              log.user ||
              log.username ||
              "Unknown"
            )
          }

        </div>

        <div class="time">

          ${
            formatTime(
              log.time ||
              log.timestamp ||
              log.createdAt
            )
          }

        </div>

      </div>

      <div class="bubble">

        ${
          escapeHtml(
            log.text ||
            log.message ||
            log.content ||
            ""
          )
        }

      </div>

    `;

    messages.appendChild(div);

  });

}

function formatTime(date){

  if(!date) return "";

  try{

    return new Date(date)
    .toLocaleTimeString([],{
      hour:"2-digit",
      minute:"2-digit"
    });

  }catch{

    return "";

  }

}

function escapeHtml(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

document
.getElementById("searchInput")
.addEventListener(
  "input",
  e => {

    const value =
      e.target.value.toLowerCase();

    const messages =
      document.querySelectorAll(
        ".message"
      );

    messages.forEach(msg => {

      const text =
        msg.textContent.toLowerCase();

      msg.style.display =
        text.includes(value)
        ? "block"
        : "none";

    });

  }
);

loadSessions();

setInterval(
  loadSessions,
  30000
);

</script>

</body>
</html>
